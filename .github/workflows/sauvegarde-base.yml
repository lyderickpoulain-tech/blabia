# Sauvegarde de la base de production de BlabIA (v6, 15/11/2026) — propre à CE dépôt.
# Remplace la commande Docker lancée à la main avant chaque mise en ligne.
# - À chaque envoi sur main : avec « Wait for CI » activé dans Railway, le déploiement
#   (et donc les migrations) n'a lieu que si cette sauvegarde a réussi.
# - Chaque lundi, et à la demande (onglet Actions › « Sauvegarde de la base » › Run workflow).
# Sauvegarde chiffrée avec BLABIA_BACKUP_PASSWORD, conservée 90 jours (artefact de l'exécution).
# Restauration : feuille de route v5.1, § 5 « Déploiement ».
name: Sauvegarde de la base
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sauvegarde-base
  cancel-in-progress: false
jobs:
  sauvegarde:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Sauvegarde chiffrée
        env:
          DB_URL: ${{ secrets.BLABIA_DB_URL }}
          BACKUP_PASSWORD: ${{ secrets.BLABIA_BACKUP_PASSWORD }}
        run: |
          if [ -z "$DB_URL" ] || [ -z "$BACKUP_PASSWORD" ]; then
            echo "::error::Secrets BLABIA_DB_URL ou BLABIA_BACKUP_PASSWORD absents : aucune sauvegarde, la mise en ligne doit attendre."
            exit 1
          fi
          docker run --rm -e PGURL="$DB_URL" postgres:18 sh -c 'pg_dump --format=custom --no-owner --no-privileges "$PGURL"' > base.dump
          test -s base.dump
          printf '%s' "$BACKUP_PASSWORD" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 -o base.dump.gpg base.dump
          rm -f base.dump
          ls -l base.dump.gpg
      - name: Conservation (90 jours)
        uses: actions/upload-artifact@v4
        with:
          name: sauvegarde-base-${{ github.event_name }}-${{ github.run_id }}
          path: base.dump.gpg
          retention-days: 90
